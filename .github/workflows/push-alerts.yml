# 휴대폰 알림(웹 푸시) 발송 — /api/push 의 "send"를 불러 준다.
# send는 같은 알림을 두 번 만들거나 같은 사람에게 두 번 보내지 않으므로 여러 번 불러도 안전하다.
#
# 언제 도나
#  - data.json이 main에 올라올 때(매일 06:53쯤 그날 신고분으로 바뀜): 07:40까지 기다렸다가 실거래 요약 발송
#    → GitHub 예약(schedule)은 수십 분 밀리거나 건너뛰는 일이 잦아서, 커밋(push)을 주 신호로 쓴다
#  - 새 글 발행(blog/posts.json 변경): 배포가 끝날 시간을 두고 새 글 알림
#  - 예약 실행은 위가 모두 실패했을 때를 위한 예비용
# 비밀값(Secrets)은 필요 없다.
name: push-alerts

on:
  push:
    branches: [main]
    paths:
      - "data.json"
      - "blog/posts.json"
      - ".github/workflows/push-alerts.yml"
  schedule:
    - cron: "50 22 * * *"   # 한국 시간 07:50 (예비)
    - cron: "17 1 * * *"    # 한국 시간 10:17 (예비)
  workflow_dispatch:

concurrency:
  group: push-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: 발송 시각까지 기다리기
        if: github.event_name == 'push'
        run: |
          now=$(TZ=Asia/Seoul date +%s)
          target=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 07:40" +%s)
          wait=$(( target - now ))
          # 배포가 끝나도록 최소 150초는 기다린다. 07:40 전이면 07:40까지.
          if [ "$wait" -lt 150 ]; then wait=150; fi
          if [ "$wait" -gt 3600 ]; then wait=150; fi   # 새벽 등 한참 이른 커밋은 기다리지 않음(어차피 7시 전엔 안 만든다)
          echo "${wait}초 기다림"; sleep "$wait"
      - name: 알림 보내기
        run: |
          set +e
          bad=0
          for i in $(seq 1 60); do
            code=$(curl -sS -m 60 -o resp.txt -w '%{http_code}' -X POST https://sebuin.com/api/push \
                  -A 'Mozilla/5.0 (sebuin push-alerts; +https://github.com/Dreamer887/sejong)' \
                  -H 'content-type: application/json' -H 'accept: application/json' -d '{"action":"send"}')
            r=$(head -c 400 resp.txt | tr '\n' ' ')
            echo "[$i] HTTP $code $r"
            if ! jq -e . resp.txt >/dev/null 2>&1; then
              echo "::warning::[$i] JSON 아님 HTTP $code: $(head -c 200 resp.txt | tr '\n' ' ')"
              bad=$((bad+1)); if [ "$bad" -ge 3 ]; then echo "::error::sebuin.com이 JSON이 아닌 응답을 계속 돌려줌(차단 의심)"; exit 1; fi
              sleep 20; continue
            fi
            ok=$(jq -r '.ok // false' resp.txt)
            left=$(jq -r '.remaining // 0' resp.txt)
            sent=$(jq -r '.sent // 0' resp.txt)
            if [ "$i" = "1" ]; then echo "::notice::첫 응답 HTTP $code $r"; fi
            if [ "$ok" != "true" ]; then sleep 20; continue; fi
            if [ "$left" = "0" ]; then echo "완료"; exit 0; fi
            if [ "$sent" = "0" ] && [ "$i" -ge 5 ]; then echo "더 보낼 수 없는 대상이 남아 다음 실행에 맡김"; exit 0; fi
            sleep 2
          done
          echo "::error::60번 시도해도 발송을 끝내지 못함"; exit 1
